<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Gourmet - Detalhes do Produto</title>
    <!-- Vinculação oficial com o arquivo de estilos separado -->
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome para os ícones do design -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body style="background-color: #fcfbfa;">

    <!-- NAVBAR (Topo Escuro) -->
    <header class="navbar" style="display: flex; align-items: center; justify-content: space-between; padding: 20px 8%; background-color: #1c0f0a; border-bottom: 1px solid rgba(223, 206, 184, 0.1);">
        <div class="logo" style="display: flex; align-items: center; gap: 12px; cursor: pointer;" onclick="window.location.href='index.html'">
            <span style="font-size: 24px; line-height: 1;">☕</span>
            <span style="font-family: 'Playfair Display', serif; color: #ffffff; font-weight: bold; font-size: 16px; letter-spacing: 0.5px; line-height: 1.1;">
                CAFETERIA<br><small style="font-size: 10px; letter-spacing: 2px; color: #DFCEB8; display: block;">GOURMET</small>
            </span>
        </div>
        <nav class="nav-menu" style="display: flex; align-items: center; gap: 30px;">
            <a href="index.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="far fa-home"></i> Início</a>
            <a href="produtos.html" class="active" style="color: #ffffff; text-decoration: none; font-size: 14px;"><i class="far fa-shopping-bag"></i> Produtos</a>
            <a href="carrinho.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="far fa-shopping-cart"></i> Carrinho</a>
        </nav>
    </header>

    <!-- WRAPPER CENTRAL DO DESIGN (Usa as classes do style.css) -->
    <div class="details-wrapper">
        <main class="main-product-box">
            
            <!-- COLUNA ESQUERDA: GALERIA DE FOTOS -->
            <div class="image-gallery-side">
                <div class="main-img-container">
                    <img id="detail-product-image" src="img/bourbon.jpg" alt="Café">
                </div>
                <div class="thumbs-row">
                    <div class="thumb-box active"><img src="img/bourbon.jpg" alt="Miniatura 1"></div>
                    <div class="thumb-box"><img src="img/arabica.jpg" alt="Miniatura 2"></div>
                    <div class="thumb-box"><img src="img/tradicional.jpg" alt="Miniatura 3"></div>
                </div>
            </div>

            <!-- COLUNA DIREITA: INFORMAÇÕES PREMIUM -->
            <div class="info-side">
                <h1 id="detail-product-name" class="product-title">Carregando...</h1>
                
                <div class="rating-row">
                    <div class="stars">
                        <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                    </div>
                    <span>(128 avaliações)</span>
                </div>

                <div id="detail-product-price" class="product-price-large">R$ 0,00</div>
                
                <p id="detail-product-description" class="product-description-text">Carregando...</p>

                <ul class="specs-list">
                    <li><i class="far fa-seedling"></i> <span>Tipo: <strong id="spec-tipo">-</strong></span></li>
                    <li><i class="far fa-fire"></i> <span>Torra: <strong id="spec-torra">-</strong></span></li>
                    <li><i class="far fa-weight-hanging"></i> <span>Peso: <strong id="spec-peso">-</strong></span></li>
                    <li><i class="far fa-sliders-h"></i> <span>Moagem: <strong id="spec-moagem">-</strong></span></li>
                </ul>

                <div class="quantity-selector">
                    <button type="button" onclick="alterarQtd(-1)">-</button>
                    <input type="text" id="product-quantity-input" value="1" readonly>
                    <button type="button" onclick="alterarQtd(1)">+</button>
                </div>

                <button type="button" id="btn-detail-buy" class="btn-add-to-cart-premium">
                    <i class="fas fa-shopping-cart"></i> Adicionar ao carrinho
                </button>
            </div>
        </main>

        <!-- SEÇÃO DE AVALIAÇÕES -->
        <section class="reviews-section-box">
            <h3>Avaliações dos clientes</h3>
            <div class="reviews-dashboard">
                <div class="score-box">
                    <div class="score-number">5,0</div>
                    <div class="stars" style="font-size: 18px; margin-bottom: 8px;">
                        <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                    </div>
                    <div class="score-subtitle">Baseado em 128 avaliações</div>
                </div>
                <div class="bars-container">
                    <div class="bar-row"><span class="bar-label">5 <i class="fas fa-star" style="font-size: 10px; color:#6e5b53;"></i></span><div class="bar-track"><div class="bar-fill" style="width: 98%;"></div></div><span class="bar-percent">98%</span></div>
                    <div class="bar-row"><span class="bar-label">4 <i class="fas fa-star" style="font-size: 10px; color:#6e5b53;"></i></span><div class="bar-track"><div class="bar-fill" style="width: 2%;"></div></div><span class="bar-percent">2%</span></div>
                    <div class="bar-row"><span class="bar-label">3 <i class="fas fa-star" style="font-size: 10px; color:#6e5b53;"></i></span><div class="bar-track"><div class="bar-fill" style="width: 0%;"></div></div><span class="bar-percent">0%</span></div>
                    <div class="bar-row"><span class="bar-label">2 <i class="fas fa-star" style="font-size: 10px; color:#6e5b53;"></i></span><div class="bar-track"><div class="bar-fill" style="width: 0%;"></div></div><span class="bar-percent">0%</span></div>
                    <div class="bar-row"><span class="bar-label">1 <i class="fas fa-star" style="font-size: 10px; color:#6e5b53;"></i></span><div class="bar-track"><div class="bar-fill" style="width: 0%;"></div></div><span class="bar-percent">0%</span></div>
                </div>
            </div>
        </section>
    </div>

    <footer class="footer" style="background-color: #fcfbfa; border-top: 1px solid rgba(60, 36, 25, 0.1); display: flex; align-items: center; justify-content: space-between; padding: 25px 8%;">
        <div class="footer-brand" style="font-family: 'Playfair Display', serif; font-weight: bold; color: #1c0f0a;">CAFETERIA GOURMET</div>
        <div class="footer-contact" style="font-size: 13px; color:#3c2419;"><a href="mailto:contato@cafeteriagourmet.com.br" style="color: #3c2419; text-decoration: none;">contato@cafeteriagourmet.com.br</a></div>
    </footer>

        <!-- INTELIGÊNCIA ISOLADA ATUALIZADA (14 PRODUTOS MILIMETRICAMENTE INDEXADOS) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const idProduto = urlParams.get("id");
            if (!idProduto) return;

            // Banco de Dados Local Estrito Corrigido (Bate 100% com os links do produtos.html)
            const produtosBoutique = [
                { id: "1", name: "Café Especial Bourbon (Grãos)", type: "Especial", price: 32.90, image: "img/bourbon.jpg", description: "Cultivado acima de 1.200 metros de altitude em solo vulcânico. Apresenta notas sensoriais adocicadas que remetem a caramelo e chocolate ao leite." },
                { id: "2", name: "Café Gourmet 100% Arábica (Moído)", type: "Gourmet", price: 28.90, image: "img/arabica.jpg", description: "Blend exclusivo de grãos Arábica rigorosamente selecionados e com torra média artesanal. Possui um corpo denso e aroma marcante de castanhas." },
                { id: "13", name: "Café Tradicional Premium", type: "Tradicional", price: 19.90, image: "img/tradicional.jpg", description: "Nossa torra clássica e tradicional da casa, desenvolvida com grãos encorpados de torra média-escura. Entrega um café forte e reconfortante." },
                { id: "15", name: "Café Solúvel Liofilizado", type: "Gourmet", price: 22.90, image: "img/soluvel.jpg", description: "Produzido através do moderno processo de liofilização (congelamento a vácuo), que preserva integralmente o aroma original do grão Arábica." },
                { id: "3", name: "Café Orgânico Sustentável Torra Média", type: "Orgânico", price: 34.90, image: "img/organico.jpg", description: "Grãos produzidos em pequenas propriedades familiares sem o uso de defensivos químicos. Entrega uma bebida leve e frutada com notas de mel." },
                { id: "7", name: "Café Descafeinado Suave", type: "Descafeinado", price: 29.90, image: "img/descafeinado.jpg", description: "Extraído através do processo de lavagem com água, mantendo os compostos de sabor intactos e removendo 99,7% da cafeína. Bebida leve e equilibrada." },
                { id: "14", name: "Café Premium Torra Escura", type: "Especial", price: 39.90, image: "img/premium-escura.jpg", description: "Uma torra intensa e marcante que realça notas de cacau escuro e corpo extremamente denso. Perfeito para amantes de café forte." },
                { id: "4", name: "Kit Degustação Exclusivo", type: "Kits", price: 49.90, image: "img/kit-degustacao.jpg", description: "Perfeito para explorar novos horizontes. Contém 3 pacotes de 100g das nossas principais variedades micro-lotes (Especial, Gourmet e Orgânico)." },
                { id: "5", name: "Cápsulas Café Intenso", type: "Cápsulas", price: 24.50, image: "img/capsulas.jpg", description: "Blends de intensidade 10 com grãos de torra escura pronunciada. Caixa com 10 unidades totalmente compatíveis com máquinas Nespresso." },
                { id: "6", name: "Café Especial Geisha Raro", type: "Especial", price: 68.00, image: "img/geisha.jpg", description: "Variedade Geisha originária da Etiópia, colhida manualmente em lotes restritos. Destaca-se por um aroma floral exótico inconfundível." },
                { id: "8", name: "Moedor de Café Manual", type: "Acessórios", price: 89.90, image: "img/moedor.jpg", description: "Manivela ergonômica em aço inox com engrenagens internas de cerâmica cônica. Permite ajustar a moagem com precisão cirúrgica." },
                { id: "9", name: "Café Jacu Bird Exótico", type: "Especial", price: 145.00, image: "img/jacu.jpg", description: "Raridade nacional produzida nas montanhas do Espírito Santo. O processo de digestão natural elimina a acidez, gerando um café ultra-suave." },
                { id: "10", name: "Cold Brew Artesanal Extra Forte", type: "Gourmet", price: 16.90, image: "img/coldbrew.jpg", description: "Infusão a frio extraída lentamente por mais de 18 horas em água filtrada. Resulta em uma bebida altamente cafeinada e refrescante." },
                { id: "11", name: "Café Aromatizado de Baunilha Francesa", type: "Orgânico", price: 38.95, image: "img/baunilha.jpg", description: "Base de grãos selecionados combinada delicadamente com óleos naturais de baunilha. Proporciona um aroma doce e reconfortante." }
            ];

            // Sincroniza a memória local para o carrinho e painel admin não quebrarem
            localStorage.setItem("cafeteria_produtos_admin", JSON.stringify(produtosBoutique));

            // Encontra o café clicado comparando o ID da URL de forma estrita textualmente
            const produto = produtosBoutique.find(p => String(p.id) === String(idProduto));
            
            if (!produto) {
                document.getElementById("detail-product-name").textContent = "Produto não localizado";
                console.warn("ID buscado não encontrado no script:", idProduto);
                return;
            }

            // Injeta na tela na mesma hora limpa
            document.getElementById("detail-product-name").textContent = produto.name;
            document.getElementById("detail-product-price").textContent = "R$ " + parseFloat(produto.price).toFixed(2).replace(".", ",");
            document.getElementById("detail-product-category").textContent = produto.type;
            document.getElementById("detail-product-description").textContent = produto.description;
            
            const imgEl = document.getElementById("detail-product-image");
            if (imgEl) {
                imgEl.src = produto.image;
                imgEl.alt = produto.name;
                imgEl.style.display = "block";
            }

            // Configuração isolada e à prova de falhas do Botão Comprar
            const btnComprar = document.getElementById("btn-detail-buy");
            if (btnComprar) {
                btnComprar.addEventListener("click", () => {
                    let carrinho = JSON.parse(localStorage.getItem("cafeteria_carrinho")) || [];
                    const itemExistente = carrinho.find(item => item.id === produto.id);
                    if (itemExistente) { itemExistente.quantity++; } else {
                        carrinho.push({ id: produto.id, name: produto.name, price: parseFloat(produto.price), image: produto.image, quantity: 1 });
                    }
                    localStorage.setItem("cafeteria_carrinho", JSON.stringify(carrinho));
                    btnComprar.innerText = "✓ Adicionado com Sucesso!";
                    btnComprar.style.backgroundColor = "#28a745";
                    setTimeout(() => { btnComprar.innerText = "Adicionar ao Carrinho"; btnComprar.style.backgroundColor = "#3c2419"; }, 2000);
                });
            }
        });
    </script>
