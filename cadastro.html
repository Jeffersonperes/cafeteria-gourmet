<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Gourmet - Cadastro</title>
    <!-- Chamada oficial do arquivo de estilos separado -->
    <link rel="stylesheet" href="./style.css?v=admin-estilo-atualizado-1">
    <!-- Font Awesome para os ícones reais do design -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="admin-body-bg" style="display: flex; flex-direction: column; min-height: 100vh;">

    <!-- NAVBAR (Topo Escuro Premium Sincronizado) -->
    <header class="navbar" style="display: flex; align-items: center; justify-content: space-between; padding: 20px 8%; background-color: #1c0f0a; border-bottom: 1px solid rgba(223, 206, 184, 0.1);">
        <div class="logo" style="display: flex; align-items: center; gap: 10px; cursor: pointer;" onclick="window.location.href='./index.html'">
            <span style="font-size: 26px; line-height: 1; display: inline-block;">☕</span>
            <span style="font-family: 'Playfair Display', serif; color: #ffffff; font-weight: bold; font-size: 16px; letter-spacing: 0.5px; line-height: 1.1;">
                CAFETERIA<br><small style="font-size: 10px; letter-spacing: 2px; color: #DFCEB8; display: block;">GOURMET</small>
            </span>
        </div>
        <nav class="nav-menu" style="display: flex; align-items: center; gap: 30px;">
            <a href="./index.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="fas fa-home"></i> Início</a>
            <a href="./produtos.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="fas fa-shopping-bag"></i> Produtos</a>
            <a href="./carrinho.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="fas fa-shopping-cart"></i> Carrinho</a>
            <a href="./perfil.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="fas fa-user"></i> Perfil</a>
            <a href="./login.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="fas fa-sign-in-alt"></i> Login</a>
        </nav>
    </header>

    <!-- WRAPPER CENTRAL DO CADASTRO -->
    <div class="admin-page-wrapper" style="max-width: 550px; width: 100%; margin: 40px auto; padding: 0 20px; box-sizing: border-box;">
        <main class="admin-main-content" style="background: #ffffff; padding: 40px; border-radius: 12px; border: 1px solid rgba(60, 36, 25, 0.05); box-shadow: 0 4px 20px rgba(60, 36, 25, 0.02);">
            <div class="admin-content-header" style="text-align: center; border-bottom: 1px solid rgba(60, 36, 25, 0.08); padding-bottom: 15px; margin-bottom: 30px;">
                <h2 style="font-family: 'Playfair Display', Georgia, serif; font-size: 26px; color: #1c0f0a; margin: 0 0 5px 0; font-weight: 700;">Criar Nova Conta</h2>
                <p style="font-size: 13px; color: #6e5b53; margin: 0;">Cadastre-se para acompanhar seus pedidos e personalizar seu perfil.</p>
            </div>

            <!-- FORMULÁRIO DE CADASTRO -->
            <form id="form-cadastro-cliente" class="admin-profile-form" style="display: flex; flex-direction: column; gap: 20px;">
                <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                    <label for="cadastro-name" style="font-size: 13px; font-weight: 600; color: #3c2419;">Nome Completo</label>
                    <input type="text" id="cadastro-name" placeholder="Digite seu nome completo" required style="padding: 12px; border: 1px solid rgba(60, 36, 25, 0.2); border-radius: 6px; font-size: 14px; outline: none; width: 100%; box-sizing: border-box;">
                </div>

                <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                    <label for="cadastro-email" style="font-size: 13px; font-weight: 600; color: #3c2419;">E-mail de Contato</label>
                    <input type="email" id="cadastro-email" placeholder="seu.email@email.com" required style="padding: 12px; border: 1px solid rgba(60, 36, 25, 0.2); border-radius: 6px; font-size: 14px; outline: none; width: 100%; box-sizing: border-box;">
                </div>

                <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                    <label for="cadastro-password" style="font-size: 13px; font-weight: 600; color: #3c2419;">Criar Uma Senha</label>
                    <input type="password" id="cadastro-password" placeholder="Mínimo 6 caracteres" required style="padding: 12px; border: 1px solid rgba(60, 36, 25, 0.2); border-radius: 6px; font-size: 14px; outline: none; width: 100%; box-sizing: border-box;">
                </div>

                <div class="form-actions-row" style="display: flex; justify-content: center; margin-top: 10px;">
                    <button type="button" class="btn-admin-save" style="background-color: #2b170f; color: #ffffff; border: none; padding: 14px 45px; font-size: 14px; font-weight: 700; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 12px rgba(43, 23, 15, 0.15); width: 100%;" onclick="executarFluxoCadastro()">
                        Finalizar Cadastro
                    </button>
                </div>
                
                <p style="font-size: 13px; color: #6e5b53; text-align: center; margin-top: 10px;">Já possui uma conta? <a href="./login.html" style="color: #2b170f; font-weight: 600; text-decoration: none;">Faça Login</a></p>
            </form>
        </main>
    </div>

    <!-- RODAPÉ MESTRE -->
    <footer class="footer" style="background-color: #ffffff; border-top: 1px solid rgba(60, 36, 25, 0.1); display: flex; align-items: center; justify-content: space-between; padding: 25px 8%; width: 100%; box-sizing: border-box; margin-top: auto;">
        <div class="footer-brand" style="font-family: 'Playfair Display', serif; font-weight: bold; color: #1c0f0a;"><i class="fas fa-coffee"></i> CAFETERIA GOURMET</div>
        <div class="footer-contact" style="font-size: 13px; color:#3c2419;"><a href="mailto:contato@cafeteriagourmet.com.br" style="color: #3c2419; text-decoration: none;">contato@cafeteriagourmet.com.br</a></div>
    </footer>

    <!-- VINCULAÇÃO LOGICA DO ARQUIVO JS SEPARADO -->
    <script src="script.js"></script>
</body>
</html>
