<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Gourmet - Detalhes do Produto</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body style="background-color: #f7f4f0;">

    <!-- NAVBAR (Topo Escuro) -->
    <header class="navbar" style="display: flex; align-items: center; justify-content: space-between; padding: 20px 8%; background-color: #1c0f0a; border-bottom: 1px solid rgba(223, 206, 184, 0.1);">
        <div class="logo" style="display: flex; align-items: center; gap: 12px; cursor: pointer;" onclick="window.location.href='index.html'">
            <i class="fas fa-coffee" style="font-size: 24px; color: #DFCEB8;"></i>
            <span style="font-family: 'Playfair Display', serif; color: #ffffff; font-weight: bold; font-size: 16px; letter-spacing: 0.5px; line-height: 1.1;">
                CAFETERIA<br><small style="font-size: 10px; letter-spacing: 2px; color: #DFCEB8; display: block;">GOURMET</small>
            </span>
        </div>
        <nav class="nav-menu" style="display: flex; align-items: center; gap: 30px;">
            <a href="index.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="far fa-home"></i> Início</a>
            <a href="produtos.html" class="active" style="color: #ffffff; text-decoration: none; font-size: 14px;"><i class="far fa-shopping-bag"></i> Produtos</a>
            <a href="carrinho.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="far fa-shopping-cart"></i> Carrinho</a>
        </nav>
    </header>

    <!-- ÁREA CENTRAL DO PRODUTO -->
    <main class="main-wrapper" style="padding: 60px 8%; min-height: 75vh; display: flex; justify-content: center; align-items: center;">
        <div class="detail-container" style="display: flex; gap: 50px; background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(60, 36, 25, 0.02); width: 100%; flex-wrap: wrap; max-width: 1100px;">
            
            <!-- Foto -->
            <div class="detail-image-box" style="flex: 1; min-width: 300px; background: #fcfbfa; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 20px; height: 380px; overflow: hidden; border: 1px solid rgba(60,36,25,0.03);">
                <img id="detail-product-image" src="" alt="Foto" style="max-width: 100%; max-height: 100%; object-fit: contain; display: none;">
            </div>

            <!-- Textos -->
            <div class="detail-info-box" style="flex: 1.2; min-width: 300px; display: flex; flex-direction: column; justify-content: center;">
                <span id="detail-product-category" style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: #6e5b53; letter-spacing: 1.5px; margin-bottom: 10px; display: block;">Gourmet</span>
                <h1 id="detail-product-name" style="font-family: 'Playfair Display', serif; font-size: 32px; color: #1c0f0a; margin: 0 0 15px 0; font-weight: bold;">Buscando café...</h1>
                <p id="detail-product-description" style="color: #6e5b53; font-size: 14px; line-height: 1.6; margin-bottom: 25px;">Carregando notas sensoriais...</p>
                
                <div style="border-top: 1px solid rgba(60, 36, 25, 0.08); padding-top: 20px; margin-bottom: 25px;">
                    <span id="detail-product-price" style="font-size: 26px; font-weight: bold; color: #1c0f0a;">R$ 0,00</span>
                </div>

                <button type="button" id="btn-detail-buy" style="background-color: #3c2419; color: #ffffff; border: none; padding: 14px 28px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; max-width: 240px;">Adicionar ao Carrinho</button>
            </div>

        </div>
    </main>

    <!-- INTELIGÊNCIA ISOLADA CONTRA EMBARALHAMENTO -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const idProduto = urlParams.get("id");
            if (!idProduto) return;

            // Banco de Dados Local Estrito
            const produtosBoutique = [
                { id: "1", name: "Café Especial Bourbon Amarelo (Grãos)", type: "Especial", price: 32.90, image: "img/bourbon.jpg", description: "Cultivado acima de 1.200 metros de altitude em solo vulcânico. Apresenta notas sensoriais adocicadas que remetem a caramelo e chocolate ao leite." },
                { id: "2", name: "Café Gourmet 100% Arábica (Moído)", type: "Gourmet", price: 28.90, image: "img/arabica.jpg", description: "Blend exclusivo de grãos Arábica rigorosamente selecionados e com torra média artesanal. Possui um corpo denso e aroma marcante de castanhas." },
                { id: "13", name: "Café Tradicional Premium", type: "Tradicional", price: 19.90, image: "img/tradicional.jpg", description: "Nossa torra clássica e tradicional da casa, desenvolvida com grãos encorpados de torra média-escura. Entrega um café forte e reconfortante." },
                { id: "15", name: "Café Solúvel Liofilizado", type: "Gourmet", price: 22.90, image: "img/soluvel.jpg", description: "Produzido através do moderno processo de liofilização (congelamento a vácuo), que preserva integralmente o aroma original do grão Arábica." },
                { id: "3", name: "Café Orgânico Sustentável Torra Média", type: "Orgânico", price: 34.90, image: "img/organico.jpg", description: "Grãos produzidos em pequenas propriedades familiares sem o uso de defensivos químicos. Entrega uma bebida leve e frutada com notas de mel." },
                { id: "7", name: "Café Descafeinado Suave", type: "Descafeinado", price: 29.90, image: "img/descafeinado.jpg", description: "Extraído através do processo de lavagem com água, mantendo os compostos de sabor intactos e removendo 99,7% da cafeína. Bebida leve." },
                { id: "14", name: "Café Premium Torra Escura", type: "Especial", price: 39.90, image: "img/premium-escura.jpg", description: "Uma torra intensa e marcante que realça notas de cacau escuro e corpo extremamente denso. Perfeito para amantes de café forte." },
                { id: "4", name: "Kit Degustação Exclusivo", type: "Kits", price: 49.90, image: "img/kit-degustacao.jpg", description: "Perfeito para explorar novos horizontes. Contém 3 pacotes de 100g das nossas principais variedades micro-lotes (Especial, Gourmet e Orgânico)." },
                { id: "5", name: "Cápsulas Café Intenso", type: "Cápsulas", price: 24.50, image: "img/capsulas.jpg", description: "Blends de intensidade 10 com grãos de torra escura pronunciada. Caixa com 10 unidades totalmente compatíveis com máquinas Nespresso." },
                { id: "6", name: "Café Especial Geisha Raro", type: "Especial", price: 68.00, image: "img/geisha.jpg", description: "Variedade Geisha originária da Etiópia, colhida manualmente em lotes restritos. Destaca-se por um aroma floral exótico inconfundível." },
                { id: "8", name: "Moedor de Café Manual", type: "Acessórios", price: 89.90, image: "img/moedor.jpg", description: "Manivela ergonômica em aço inox com engrenagens internas de cerâmica cônica. Permite ajustar a moagem com precisão cirúrgica." },
                { id: "9", name: "Café Jacu Bird Exótico", type: "Especial", price: 145.00, image: "img/jacu.jpg", description: "Raridade nacional produzida nas montanhas do Espírito Santo. O processo de digestão natural elimina a acidez, gerando um café ultra-suave." },
                { id: "10", name: "Cold Brew Artesanal Extra Forte", type: "Gourmet", price: 16.90, image: "img/coldbrew.jpg", description: "Infusão a frio extraída lentamente por mais de 18 horas em água filtrada. Resulta em uma bebida altamente cafeinada e refrescante." },
                { id: "11", name: "Café Aromatizado de Baunilha Francesa", type: "Orgânico", price: 38.95, image: "img/baunilha.jpg", description: "Base de grãos selecionados combinada delicadamente com óleos naturais de baunilha. Proporciona um aroma doce e reconfortante." }
            ];

            // Força a sincronização do banco local para evitar conflito de IDs de sessões antigas
            localStorage.setItem("cafeteria_produtos_admin", JSON.stringify(produtosBoutique));

            const produto = produtosBoutique.find(p => p.id === String(idProduto));
            if (!produto) return;

            // Injeta na tela na mesma hora
            document.getElementById("detail-product-name").textContent = produto.name;
            document.getElementById("detail-product-price").textContent = "R$ " + parseFloat(produto.price).toFixed(2).replace(".", ",");
            document.getElementById("detail-product-category").textContent = produto.type;
            document.getElementById("detail-product-description").textContent = produto.description;
            
            const imgEl = document.getElementById("detail-product-image");
            if (imgEl) {
                imgEl.src = produto.image;
                imgEl.alt = produto.name;
                imgEl.style.display = "block";
            }

            // Configuração do Botão
            const btnComprar = document.getElementById("btn-detail-buy");
            if (btnComprar) {
                btnComprar.addEventListener("click", () => {
                    let carrinho = JSON.parse(localStorage.getItem("cafeteria_carrinho")) || [];
                    const itemExistente = carrinho.find(item => item.id === produto.id);
                    if (itemExistente) { itemExistente.quantity++; } else {
                        carrinho.push({ id: produto.id, name: produto.name, price: parseFloat(produto.price), image: produto.image, quantity: 1 });
                    }
                    localStorage.setItem("cafeteria_carrinho", JSON.stringify(carrinho));
                    btnComprar.innerText = "✓ Adicionado!";
                    btnComprar.style.backgroundColor = "#28a745";
                    setTimeout(() => { btnComprar.innerText = "Adicionar ao Carrinho"; btnComprar.style.backgroundColor = "#3c2419"; }, 2000);
                });
            }
        });
