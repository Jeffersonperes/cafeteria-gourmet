<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Gourmet - Detalhes do Produto</title>
    <link rel="stylesheet" href="style.css">
    <!-- CDN do Font Awesome para os ícones do menu e rodapé -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body style="background-color: #f7f4f0;">

    <!-- NAVBAR (Topo Escuro Padronizado) -->
    <header class="navbar" style="display: flex; align-items: center; justify-content: space-between; padding: 20px 8%; background-color: #1c0f0a; border-bottom: 1px solid rgba(223, 206, 184, 0.1);">
        <div class="logo" style="display: flex; align-items: center; gap: 12px; cursor: pointer;" onclick="window.location.href='index.html'">
            <i class="fas fa-coffee" style="font-size: 24px; color: #DFCEB8;"></i>
            <span style="font-family: 'Playfair Display', serif; color: #ffffff; font-weight: bold; font-size: 16px; letter-spacing: 0.5px; line-height: 1.1;">
                CAFETERIA<br><small style="font-size: 10px; letter-spacing: 2px; color: #DFCEB8; display: block;">GOURMET</small>
            </span>
        </div>
        <nav class="nav-menu" id="nav-menu" style="display: flex; align-items: center; gap: 30px;">
            <a href="index.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="far fa-home"></i> Início</a>
            <a href="produtos.html" class="active" style="color: #ffffff; text-decoration: none; font-size: 14px;"><i class="far fa-shopping-bag"></i> Produtos</a>
            <a href="carrinho.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="far fa-shopping-cart"></i> Carrinho</a>
            <a href="perfil.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="far fa-user"></i> Perfil</a>
        </nav>
    </header>

    <!-- ÁREA CENTRAL DO PRODUTO (100% DINÂMICA) -->
    <main class="main-wrapper" style="padding: 60px 8%; min-height: 75vh; display: flex; justify-content: center; align-items: center;">
        <div class="detail-container" style="display: flex; gap: 50px; background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(60, 36, 25, 0.02); width: 100%; flex-wrap: wrap; max-width: 1100px;">
            
            <!-- Lado Esquerdo: Bloco da Foto -->
            <div class="detail-image-box" style="flex: 1; min-width: 300px; background: #fcfbfa; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 20px; height: 380px; overflow: hidden; border: 1px solid rgba(60,36,25,0.03);">
                <img id="detail-product-image" src="" alt="Foto do Café" style="max-width: 100%; max-height: 100%; object-fit: contain; display: none;">
            </div>

            <!-- Lado Direito: Textos Informativos -->
            <div class="detail-info-box" style="flex: 1.2; min-width: 300px; display: flex; flex-direction: column; justify-content: center;">
                <span id="detail-product-category" style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: #6e5b53; letter-spacing: 1.5px; margin-bottom: 10px; display: block;">Categoria</span>
                
                <h1 id="detail-product-name" style="font-family: 'Playfair Display', serif; font-size: 32px; color: #1c0f0a; margin: 0 0 15px 0; font-weight: bold;">Buscando café...</h1>
                
                <p id="detail-product-description" style="color: #6e5b53; font-size: 14px; line-height: 1.6; margin-bottom: 25px;">Carregando notas sensoriais...</p>
                
                <div style="border-top: 1px solid rgba(60, 36, 25, 0.08); padding-top: 20px; margin-bottom: 25px;">
                    <span id="detail-product-price" style="font-size: 26px; font-weight: bold; color: #1c0f0a;">R$ 0,00</span>
                </div>

                <button type="button" id="btn-detail-buy" style="background-color: #3c2419; color: #ffffff; border: none; padding: 14px 28px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; max-width: 240px; transition: background-color 0.2s;">Adicionar ao Carrinho</button>
            </div>

        </div>
    </main>

    <!-- RODAPÉ COMPLETO -->
    <footer class="footer" style="background-color: #f7f4f0; border-top: 1px solid rgba(60, 36, 25, 0.1); display: flex; align-items: center; justify-content: space-between; padding: 25px 8%;">
        <div class="footer-brand" style="font-family: 'Playfair Display', serif; font-weight: bold; color: #1c0f0a; font-size: 14px;"><i class="fas fa-coffee"></i> CAFETERIA GOURMET</div>
        <div class="footer-contact" style="font-size: 13px;"><a href="mailto:contato@cafeteriagourmet.com.br" style="color: #3c2419; text-decoration: none;">contato@cafeteriagourmet.com.br</a></div>
    </footer>

    <!-- INTELIGÊNCIA MESTRE BLINDADA (IMPOSSÍVEL FICAR EM BRANCO OU CONGELADO) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Tenta pegar o ID passado pelo link da imagem (ex: detalhes.html?id=13)
            const urlParams = new URLSearchParams(window.location.search);
            let idProduto = urlParams.get("id");

            // 2. BANCO DE DADOS INTERNO OFICIAL DOS PRODUTOS
            const produtosMestre = [
                { id: "1", name: "Café Especial Bourbon (Grãos)", type: "Especial", price: 32.90, image: "img/bourbon.jpg", description: "Cultivado acima de 1.200 metros de altitude em solo vulcânico. Apresenta notas sensoriais adocicadas que remetem a caramelo, chocolate ao leite e uma acidez cítrica perfeitamente equilibrada de frutas amarelas." },
                { id: "2", name: "Café Gourmet 100% Arábica (Moído)", type: "Gourmet", price: 28.90, image: "img/arabica.jpg", description: "Blend exclusivo de grãos Arábica rigorosamente selecionados e com torra média artesanal. Possui um corpo denso, aroma marcante de castanhas torradas e notas sutis de açúcar mascavo." },
                { id: "3", name: "Café Tradicional Premium", type: "Tradicional", price: 19.90, image: "img/tradicional.jpg", description: "Nossa torra clássica e tradicional da casa, desenvolvida com grãos encorpados de torra média-escura. Entrega um café forte, robusto e reconfortante, com baixa acidez e muito sabor." },
                { id: "14", name: "Café Solúvel Liofilizado", type: "Gourmet", price: 22.90, image: "img/soluvel.jpg", description: "Produzido através do moderno processo de liofilização (congelamento a vácuo), que preserva integralmente o óleo essencial, o aroma e as características originais do grão Arábica." },
                { id: "4", name: "Café Orgânico Sustentável Torra Média", type: "Orgânico", price: 34.90, image: "img/organico.jpg", description: "Grãos produzidos em pequenas propriedades familiares sem o uso de defensivos químicos ou fertilizantes artificiais. Entrega uma bebida leve, frutada, com notas de mel." },
                { id: "7", name: "Kit Degustação Exclusivo", type: "Kits", price: 49.90, image: "img/kit-degustacao.jpg", description: "Perfeito para explorar novos horizons. Contém 3 pacotes de 100g das nossas principais variedades micro-lotes (Especial, Gourmet e Orgânico)." },
                { id: "8", name: "Cápsulas Café Intenso", type: "Cápsulas", price: 24.50, image: "img/capsulas.jpg", description: "Blends de intensidade 10 com grãos de torra escura pronunciada. Caixa com 10 unidades totalmente compatíveis com máquinas Nespresso." },
                { id: "9", name: "Café Especial Geisha Raro", type: "Especial", price: 68.00, image: "img/geisha.jpg", description: "Variedade Geisha originária da Etiópia, colhida manualmente em lotes restritos. Considerado um dos melhores cafés do mundo, destaca-se por um aroma floral exótico." },
                { id: "5", name: "Café Descafeinado Suave", type: "Descafeinado", price: 29.90, image: "img/descafeinado.jpg", description: "Extraído através do processo de lavagem com água, mantendo os compostos de sabor intactos e removendo 99,7% da cafeína. Bebida leve e equilibrada." },
                { id: "10", name: "Moedor de Café Manual", type: "Acessórios", price: 89.90, image: "img/moedor.jpg", description: "Manivela ergonômica em aço inox com engrenagens internas de cerâmica cônica. Permite ajustar a moagem com precisão." },
                { id: "11", name: "Café Jacu Bird Exótico", type: "Especial", price: 145.00, image: "img/jacu.jpg", description: "Raridade nacional produzida nas montanhas do Espírito Santo. Os frutos são selecionados e ingeridos organicamente pelo pássaro Jacu, gerando um café ultra-suave." },
                { id: "12", name: "Cold Brew Artesanal Extra Forte", type: "Gourmet", price: 16.90, image: "img/coldbrew.jpg", description: "Infusão a frio extraída lentamente por mais de 18 horas em água filtrada. Esse processo reduz o amargor tradicional em 60%, resultando em uma bebida altamente cafeinada." },
                { id: "13", name: "Café Aromatizado de Baunilha Francesa", type: "Orgânico", price: 38.95, image: "img/baunilha.jpg", description: "Base de grãos selecionados combinada delicadamente com óleos naturais de baunilha de Madagascar durante o resfriamento da torra." },
            ];

            // 🔥 REGRA DE CONTINGÊNCIA MASTER: Se o ID vier em branco por erro de clique do HTML,
            // o sistema assume automaticamente o ID mestre 13 (Café Tradicional) para destravar a tela
            if (!idProduto || idProduto === "" || idProduto === "null") {
                console.warn("⚠️ URL sem ID válido detectada. Ativando produto padrão de contingência.");
                idProduto = "13"; 
            }

            // 3. Busca o produto na matriz pelo ID
            const produto = produtosMestre.find(p => p.id === String(idProduto));

            if (!produto) {
                console.error("Produto não localizado para o ID:", idProduto);
                return;
            }

            // 4. Injeta os dados dinamicamente de forma inabalável nas tags HTML
            document.getElementById("detail-product-name").textContent = produto.name;
            document.getElementById("detail-product-price").textContent = "R$ " + parseFloat(produto.price).toFixed(2).replace(".", ",");
            document.getElementById("detail-product-category").textContent = produto.type;
            document.getElementById("detail-product-description").textContent = produto.description;
            
            const imgEl = document.getElementById("detail-product-image");
            if (imgEl) {
                imgEl.src = produto.image;
                imgEl.alt = produto.name;
                imgEl.style.display = "block"; // Força a exibição da imagem da pasta img
            }

            // 5. Configuração funcional isolada do botão de comprar
            const btnComprar = document.getElementById("btn-detail-buy");
            if (btnComprar) {
                btnComprar.addEventListener("click", () => {
                    let carrinho = JSON.parse(localStorage.getItem("cafeteria_carrinho")) || [];
                    const itemExistente = carrinho.find(item => item.id === produto.id);

                    if (itemExistente) {
                        itemExistente.quantity++;
                    } else {
                        carrinho.push({
                            id: produto.id,
                            name: produto.name,
                            price: parseFloat(produto.price),
                            image: produto.image,
                            quantity: 1
                        });
                    }

                    localStorage.setItem("cafeteria_carrinho", JSON.stringify(carrinho));
                    
                    btnComprar.innerText = "✓ Adicionado com Sucesso!";
                    btnComprar.style.backgroundColor = "#28a745";
                    
                    setTimeout(() => {
                        btnComprar.innerText = "Adicionar ao Carrinho";
                        btnComprar.style.backgroundColor = "#3c2419";
                    }, 2000);
                });
            }
        });
    </script>
