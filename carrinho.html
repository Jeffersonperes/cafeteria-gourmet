<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Gourmet - Meu Carrinho</title>
    <link rel="stylesheet" href="style.css">
    <!-- CDN Oficial do Font Awesome para carregar os ícones perfeitamente -->
    <link rel="stylesheet" href="https://cloudflare.com" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>

    <!-- NAVBAR (Topo Escuro) -->
    <header class="navbar">
    <div class="logo" style="display: flex; align-items: center; gap: 10px; cursor: pointer;" onclick="window.location.href='index.html'">
    <!-- SÍMBOLO NATIVO DE XÍCARA EM TEXTO PURO (NUNCA FALHA) -->
    <span style="font-size: 26px; line-height: 1; display: inline-block;">☕</span>
    <span style="font-family: 'Playfair Display', serif; color: #ffffff; font-weight: bold; font-size: 16px; letter-spacing: 0.5px; line-height: 1.1;">
        CAFETERIA<br><small style="font-size: 10px; letter-spacing: 2px; color: #DFCEB8; display: block;">GOURMET</small>
    </span>
</div>
    
    <!-- O menu ganha o ID correto "nav-menu" -->
    <nav class="nav-menu" id="nav-menu">
        <a href="index.html" class="active"><i class="fas fa-home"></i> Início</a>
        <a href="produtos.html"><i class="fas fa-shopping-bag"></i> Produtos</a>
        <a href="carrinho.html" class="cart-link">
            <i class="fas fa-shopping-cart"></i> Carrinho 
            <span class="cart-badge">0</span>
        </a>
        <a href="perfil.html"><i class="fas fa-user"></i> Perfil</a>
    </nav>

    <!-- O BOTÃO AGORA CHAMA A FUNÇÃO DIRETO NO CLIQUE (IMPOSSÍVEL TRAVAR) -->
    <button class="menu-hamburger" id="menu-hamburger" type="button" onclick="toggleMenuMobile()">☰</button>
</header>

    <!-- CONTEÚDO DO CARRINHO -->
    <main class="cart-container">
        <h2>Meu carrinho</h2>

        <!-- Títulos da Tabela/Lista -->
        <div class="cart-labels-header">
            <span class="label-prod">Produto</span>
            <span class="label-qty">Quantidade</span>
            <span class="label-val">Valor</span>
        </div>

        <!-- LISTA DE ITENS DINÂMICA (Unificada e Limpa) -->
        <div class="cart-items-list" id="cart-items-container">
            <!-- O JavaScript vai gerenciar de forma 100% dinâmica tudo aqui dentro -->
            <p style="text-align: center; color: var(--text-muted); padding: 40px;">Seu carrinho está vazio...</p>
        </div>

        <!-- PAINEL DE RESUMO DA COMPRA -->
        <div class="cart-summary-wrapper">
            <div class="summary-box">
                <div class="summary-row">
                    <span class="summary-label">Subtotal</span>
                    <span class="summary-value" id="cart-subtotal">R$ 0,00</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Frete</span>
                    <span class="summary-value" id="cart-shipping">R$ 0,00</span>
                </div>
                <div class="summary-row total-row">
                    <span class="total-label">Total</span>
                    <span class="total-value" id="cart-total">R$ 0,00</span>
                </div>
                <button type="button" class="btn-checkout">Finalizar Compra</button>
            </div>
        </div>
    </main>

    <!-- RODAPÉ (Footer Claro) -->
    <footer class="footer">
        <div class="footer-brand">
            <i class="fas fa-seedling"></i>
            <span>CAFETERIA GOURMET</span>
        </div>
        <div class="footer-contact">
            <a href="mailto:contato@cafeteriagourmet.com.br">contato@cafeteriagourmet.com.br</a>
        </div>
        <div class="footer-social">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-facebook-f"></i></a>
        </div>
    </footer>

    <!-- Executa o arquivo mestre com os cálculos -->
    <script src="script.js"></script>
    
</body>
</html>
