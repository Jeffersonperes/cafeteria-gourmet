<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Gourmet - Meu Perfil</title>
    <!-- CHAMADA DO DESIGN SEPARADO COM QUEBRA DE CACHE INDUSTRIAL -->
    <link rel="stylesheet" href="./style.css?v=fidelidade-estilo-9">
    <!-- Font Awesome para os ícones reais do design -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="profile-body-bg">

    <!-- NAVBAR (Topo Escuro Premium) -->
    <header class="navbar">
        <div class="logo" onclick="window.location.href='./index.html'">
            <span>☕</span>
            <span>CAFETERIA<br><small>GOURMET</small></span>
        </div>
        <nav class="nav-menu">
            <a href="./index.html"><i class="fas fa-home"></i> Início</a>
            <a href="./produtos.html"><i class="fas fa-shopping-bag"></i> Produtos</a>
            <a href="./carrinho.html" class="cart-link"><i class="fas fa-shopping-cart"></i> Carrinho</a>
            <a href="./perfil.html" class="active"><i class="fas fa-user"></i> Perfil</a>
            <a href="./login.html"><i class="fas fa-sign-in-alt"></i> Login</a>
        </nav>
    </header>

    <!-- WRAPPER CENTRAL DO DESIGN -->
    <div class="profile-page-wrapper">
        
        <!-- CARD 1: DADOS DO PERFIL (IDs CORRIGIDAS E INTEGRADAS) -->
        <section class="profile-card-info">
            <div class="profile-info-left">
                <!-- Círculo do Avatar gerenciado pelo perfil.js -->
                <div class="profile-avatar-circle">
                    <i class="fas fa-user"></i>
                </div>
                <div class="profile-details-text">
                    <!-- O JavaScript vai injetar os dados salvos nestas IDs abaixo -->
                    <h2 id="user-display-name">Seu Nome</h2>
                    <span class="client-since-badge"><i class="far fa-calendar-alt"></i> Cliente VIP</span>
                    
                    <div class="contact-info-list">
                        <p><i class="far fa-envelope"></i> <span id="user-display-email">seu.email@email.com</span></p>
                        <p><i class="fas fa-phone-alt"></i> <span id="user-display-phone">(00) 00000-0000</span></p>
                        <p><i class="fas fa-map-marker-alt"></i> <span id="user-display-address">Seu endereço completo aparecerá aqui</span></p>
                    </div>
                </div>
            </div>
            
            <!-- COLUNA DE AÇÕES DA DIREITA (REDIGIDA CONFORME SEU DESEJO) -->
            <div class="profile-actions-right">
                <button type="button" class="btn-profile-edit" onclick="window.location.href='./admin-perfil.html'">
                    <i class="far fa-edit"></i> Editar Perfil
                </button>
                <button type="button" class="btn-profile-logout" onclick="window.location.href='./index.html'">
                    <i class="fas fa-sign-out-alt"></i> Sair da Conta
                </button>
            </div>
        </section>

        <!-- CARD 2: HISTÓRICO DE PEDIDOS DINÂMICO (INICIA OCULTO ATÉ HAVER COMPRA) -->
        <section id="card-historico-pedidos" class="orders-history-card" style="display: none !important;">
            <div class="orders-header-row">
                <h3>Histórico de Pedidos</h3>
                <a href="./meus-pedidos.html" class="view-all-link">Ver todos <i class="fas fa-chevron-right"></i></a>
            </div>

            <!-- CONTAINER QUE SERÁ MOLDADO DINAMICAMENTE CONFORME OS ITENS DO CARRINHO -->
            <div class="orders-list-container" id="perfil-historico-pedidos"></div>
        </section>
    </div>

    <!-- RODAPÉ MESTRE -->
    <footer class="footer">
        <div class="footer-brand"><i class="fas fa-coffee"></i> CAFETERIA GOURMET</div>
        <div class="footer-contact"><a href="mailto:contato@cafeteriagourmet.com.br">contato@cafeteriagourmet.com.br</a></div>
    </footer>

    <!-- ENGINE SEPARADA DE RECONHECIMENTO DE DADOS COM ANTI-CACHE MÁXIMO -->
    <script src="script.js"></script>
</body>
</html>
