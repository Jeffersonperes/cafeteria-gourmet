<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Gourmet - Meu Perfil</title>
    <!-- ROTA RELATIVA ABSOLUTA SEGURO CONTRA QUEBRAS DO GITHUB PAGES -->
    <link rel="stylesheet" href="./style.css">
    <!-- Font Awesome para os ícones reais do design (incluindo o avatar) -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body style="background-color: #fcfbfa; color: #3c2419;">

    <!-- NAVBAR (Topo Escuro Premium Sincronizado) -->
    <header class="navbar" style="display: flex; align-items: center; justify-content: space-between; padding: 20px 8%; background-color: #1c0f0a; border-bottom: 1px solid rgba(223, 206, 184, 0.1);">
        <div class="logo" style="display: flex; align-items: center; gap: 10px; cursor: pointer;" onclick="window.location.href='./index.html'">
            <span style="font-size: 26px; line-height: 1; display: inline-block;">☕</span>
            <span style="font-family: 'Playfair Display', serif; color: #ffffff; font-weight: bold; font-size: 16px; letter-spacing: 0.5px; line-height: 1.1;">
                CAFETERIA<br><small style="font-size: 10px; letter-spacing: 2px; color: #DFCEB8; display: block;">GOURMET</small>
            </span>
        </div>
        <nav class="nav-menu" style="display: flex; align-items: center; gap: 30px;">
            <a href="./index.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="fas fa-home"></i> Início</a>
            <a href="./produtos.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="fas fa-shopping-bag"></i> Produtos</a>
            <a href="./carrinho.html" style="color: #DFCEB8; text-decoration: none; font-size: 14px;"><i class="fas fa-shopping-cart"></i> Carrinho</a>
            <a href="./perfil.html" class="active" style="color: #ffffff; text-decoration: none; font-size: 14px;"><i class="fas fa-user"></i> Perfil</a>
        </nav>
    </header>

    <!-- WRAPPER CENTRAL DO PERFIL -->
    <div class="profile-wrapper" style="max-width: 800px; margin: 50px auto; padding: 0 20px; box-sizing: border-box;">
        <main class="profile-container" style="background-color: #ffffff; border-radius: 12px; padding: 40px; box-shadow: 0 4px 20px rgba(60, 36, 25, 0.04); border: 1px solid rgba(60, 36, 25, 0.05); display: flex; flex-direction: column; align-items: center;">
            
            <!-- ÁREA DO AVATAR: BONEQUINHO CINZA PREMIUM -->
            <div class="avatar-box" style="width: 120px; height: 120px; background-color: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border: 3px solid #dfceb8; box-shadow: 0 4px 10px rgba(0,0,0,0.02); position: relative; overflow: hidden;">
                <!-- Ícone oficial do bonequinho cinza (User Silhouette) -->
                <i class="fas fa-user" style="font-size: 64px; color: #94a3b8; margin-top: 15px;"></i>
            </div>

            <h2 style="font-family: 'Playfair Display', Georgia, serif; font-size: 26px; color: #1c0f0a; margin: 0 0 5px 0; font-weight: 700;">Área do Cliente</h2>
            <p style="font-size: 13px; color: #6e5b53; margin-bottom: 35px;">Gerencie suas informações cadastrais e pedidos</p>

            <!-- FORMULÁRIO DE DADOS OPERACIONAIS -->
            <form id="form-perfil" style="width: 100%; display: flex; flex-direction: column; gap: 20px;">
                <div style="display: flex; gap: 20px; flex-wrap: wrap; width: 100%;">
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-size: 13px; font-weight: 600; color: #3c2419;">Nome Completo</label>
                        <input type="text" value="Cliente Gourmet" style="padding: 12px; border: 1px solid rgba(60, 36, 25, 0.2); border-radius: 6px; font-size: 14px; outline: none; background-color: #faf9f7;">
                    </div>
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-size: 13px; font-weight: 600; color: #3c2419;">E-mail Cadastrado</label>
                        <input type="email" value="cliente@cafeteriagourmet.com" style="padding: 12px; border: 1px solid rgba(60, 36, 25, 0.2); border-radius: 6px; font-size: 14px; outline: none; background-color: #faf9f7;">
                    </div>
                </div>

                <div style="display: flex; gap: 20px; flex-wrap: wrap; width: 100%;">
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-size: 13px; font-weight: 600; color: #3c2419;">Telefone / WhatsApp</label>
                        <input type="text" value="(11) 99999-9999" style="padding: 12px; border: 1px solid rgba(60, 36, 25, 0.2); border-radius: 6px; font-size: 14px; outline: none; background-color: #faf9f7;">
                    </div>
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-size: 13px; font-weight: 600; color: #3c2419;">Endereço de Entrega Principal</label>
                        <input type="text" value="Av. Paulista, 1000 - São Paulo/SP" style="padding: 12px; border: 1px solid rgba(60, 36, 25, 0.2); border-radius: 6px; font-size: 14px; outline: none; background-color: #faf9f7;">
                    </div>
                </div>

                <button type="button" style="background-color: #2b170f; color: #ffffff; border: none; padding: 14px 30px; font-size: 14px; font-weight: 700; border-radius: 6px; cursor: pointer; width: fit-content; margin: 15px auto 0 auto; transition: background-color 0.2s; box-shadow: 0 4px 12px rgba(43, 23, 15, 0.15);" onclick="alert('✓ Dados atualizados localmente com sucesso!')">
                    Salvar Alterações
                </button>
            </form>

        </main>
    </div>

    <!-- RODAPÉ COMPLETO -->
    <footer class="footer" style="background-color: #f7f4f0; border-top: 1px solid rgba(60, 36, 25, 0.1); display: flex; align-items: center; justify-content: space-between; padding: 25px 8%; margin-top: 60px;">
        <div class="footer-brand" style="font-family: 'Playfair Display', serif; font-weight: bold; color: #1c0f0a;"><i class="fas fa-coffee"></i> CAFETERIA GOURMET</div>
        <div class="footer-contact" style="font-size: 13px; color:#3c2419;"><a href="mailto:contato@cafeteriagourmet.com.br" style="color: #3c2419; text-decoration: none;">contato@cafeteriagourmet.com.br</a></div>
    </footer>

</body>
</html>
